networks:
  middleware-db_middleware-sail:
    external: true # 引用base创建的外部网络

services:
  apisix:
    image: apache/apisix:3.17.0
    container_name: apisix-gateway
    restart: always
    ports:
      - "9180:9180/tcp"
      - "9080:9080/tcp"
      - "9091:9091/tcp"
      - "9443:9443/tcp"
    volumes:
      - ./config.yaml:/usr/local/apisix/conf/config.yaml
      - ./plugins/umc-auth.lua:/usr/local/apisix/apisix/plugins/umc-auth.lua
    networks:
      - middleware-db_middleware-sail
