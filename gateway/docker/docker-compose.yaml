version: "3.8"

networks:
  middleware-db_middleware-sail:
    external: true # 引用base创建的外部网络

services:
  apisix:
    image: apache/apisix:3.17.0
    container_name: apisix-gateway
    restart: always
    ports:
      - "127.0.0.1:9180:9180/tcp"
      - "9080:9080/tcp"
      - "9091:9091/tcp"
      - "9443:9443/tcp"
    volumes:
      - ./config.yaml:/usr/local/apisix/conf/config.yaml
    networks:
      - middleware-db_middleware-sail

  apisix-dashboard:
    image: apache/apisix-dashboard:latest
    container_name: apisix-dashboard
#    restart: always
    ports:
      - "9000:9000"
    environment:
      - ETCD_ENDPOINTS=http://etcd:2379
#    depends_on:
#      - etcd
#    extra_hosts:
#      - "etcd:"
    volumes:
      - ./dashboard.yaml:/usr/local/apisix-dashboard/conf/conf.yaml
    networks:
      - middleware-db_middleware-sail
