conf:
  listen:
    port: 9000
  etcd:
    endpoints:
      - etcd:2379
    prefix: /apisix
  log:
    error_log:
      level: warn
      file_path: logs/error.log
    access_log:
      file_path: logs/access.log

authentication:
  secret: apisix-dashboard-local-secret
  expire_time: 3600
  users:
    - username: admin
      password: admin

oidc:
  enabled: false
