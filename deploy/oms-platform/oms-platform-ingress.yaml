apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    alb.ingress.kubernetes.io/ssl-redirect: "true"
  labels:
    app: oms-platform-ingress
  name: oms-platform-ingress
  namespace: supply-group
spec:
  ingressClassName: alb
  rules:
  - host: api.cloudkra.com
    http:
      paths:
      - backend:
          service:
            name: oms-platform-svc
            port:
              number: 8080
        path: /oms/
        pathType: Prefix
  tls:
  - hosts:
    - api.cloudkra.com
