#--------------K8s发送TERM信号 → 执行preStop钩子 → 等待进程自行退出 → 若超时（达到宽限期）则发送SIGKILL强制杀死------
#--------------
apiVersion: v1
kind: Service
metadata:
  labels:
    app: supply-group-oms-platform
  name: supply-group-oms-platform-svc
  namespace: westmonth
spec:
  ports:
  - name: http
    port: 9501
    protocol: TCP
    targetPort: http
  selector:
    app.kubernetes.io/instance: supply-group-oms-platform
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: supply-group-oms-platform
  name: supply-group-oms-platform
  namespace: westmonth
spec:
  replicas: 3
  selector:
    matchLabels:
      app: supply-group-oms-platform
      app.kubernetes.io/instance: supply-group-oms-platform
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  # 新Pod就绪后，等待3秒再加入流量池,预加载swoole协程
  minReadySeconds: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: supply-group-oms-platform
        app: supply-group-oms-platform
    spec:
      containers:
      # 环境变量设置
      - env:
        - name: aliyun_logs_k8s-supply-group-oms-platform
          value: /webser/logs/oms-platform/*/*
        - name: CPU_LIMIT
          valueFrom:
            resourceFieldRef:
              resource: limits.cpu
        - name: MEMORY_LIMIT
          valueFrom:
            resourceFieldRef:
              resource: limits.memory
        image: registry.cn-shenzhen.aliyuncs.com/westmonth_apps/supply_group_oms_platform:oms-p-20250702-v03-46
        imagePullPolicy: IfNotPresent
        # 存活探针：检测服务是否存活，失败则重启Pod
        livenessProbe:
          failureThreshold: 2
          httpGet:
            path: /heart
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 2
        name: oms-platform
        ports:
        - containerPort: 9501
          name: http
          protocol: TCP
        # 就绪探针：检测服务是否可接收流量，失败则移除流量
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /health
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 2
          timeoutSeconds: 2
        # 资源配置
        resources:
          limits:
            cpu: "3"
            ephemeral-storage: 30Gi
            memory: 3Gi
          requests:
            cpu: 300m
            ephemeral-storage: 1Gi
            memory: 1Gi
        # 启动探针（startupProbe）：检测容器是否“启动完成”，失败则重启Pod
        startupProbe:
          failureThreshold: 5
          httpGet:
            path: /heart
            port: http
            scheme: HTTP
          initialDelaySeconds: 3 # 容器启动后延迟3秒再开始检测（避免进程未启动就检测）
          periodSeconds: 2
          successThreshold: 1
          timeoutSeconds: 2
        # 优雅关闭配置：preStop
        lifecycle:
          preStop:
            sleep:
              seconds: 15
      # 终止宽限期：给30秒处理存量请求
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: aly-registry
        - name: vpc-aly-registry
      restartPolicy: Always
