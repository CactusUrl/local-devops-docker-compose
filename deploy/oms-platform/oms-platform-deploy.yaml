apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: oms-platform
  name: oms-platform
  namespace: supply-group
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oms-platform
      app.kubernetes.io/instance: oms-platform
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: oms-platform
        app: oms-platform
    spec:
      containers:
      - env:
        - name: aliyun_logs_k8s-oms-platform
          value: /webser/logs/oms-platform
        image: registry.cn-shenzhen.aliyuncs.com/westmonth_apps/oms_platform:V1.0.0.02-26
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 2
          httpGet:
            path: /
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 2
        name: app
        ports:
        - containerPort: 9501
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 2
          timeoutSeconds: 2
        resources:
          limits:
            cpu: "2"
            ephemeral-storage: 30Gi
            memory: 2Gi
          requests:
            cpu: 100m
            ephemeral-storage: 1Gi
            memory: 100Mi
        startupProbe:
          failureThreshold: 5
          httpGet:
            path: /
            port: http
            scheme: HTTP
          initialDelaySeconds: 2
          periodSeconds: 2
          successThreshold: 1
          timeoutSeconds: 2
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: aly-registry
        - name: vpc-aly-registry
      restartPolicy: Always
