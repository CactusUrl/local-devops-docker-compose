apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: oms-platform
  name: oms-platform
  namespace: supply-group
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oms-platform
      app.kubernetes.io/instance: oms-platform
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  minReadySeconds: 10  # 新Pod就绪后，等待10秒再加入流量池
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: oms-platform
        app: oms-platform
    spec:
      containers:
        - env:
            - name: aliyun_logs_k8s-oms-platform
              value: /webser/logs/oms-platform
          image: registry.cn-shenzhen.aliyuncs.com/westmonth_apps/oms_platform:V1.0.0.02-26
          imagePullPolicy: IfNotPresent
          # 存活探针：检测服务是否存活，失败则重启Pod
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /heart  # 替换为专属存活检测接口
              port: http
              scheme: HTTP
            initialDelaySeconds: 15  # 启动15秒后首次检测
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 3
          name: app
          ports:
            - containerPort: 9501
              name: http
              protocol: TCP
          # 就绪探针：检测服务是否可接收流量，失败则移除流量
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /health  # 替换为检测核心依赖的就绪接口
              port: http
              scheme: HTTP
            initialDelaySeconds: 10  # 启动10秒后首次检测（适配Hyperf启动耗时）
            periodSeconds: 3
            successThreshold: 2      # 连续2次成功才算就绪
            timeoutSeconds: 2
          # 启动探针：确保进程完全启动，失败则重启Pod
          startupProbe:
            failureThreshold: 8      # 最多检测8次（2*5=16秒），失败则重启
            httpGet:
              path: /heart  # 简化的启动检测接口（仅检测端口+进程）
              port: http
              scheme: HTTP
            initialDelaySeconds: 3   # 稍等3秒再开始检测
            periodSeconds: 2
            successThreshold: 1
            timeoutSeconds: 2
          # 资源配置：缩小请求与限制的差距，适配Hyperf运行需求
          resources:
            limits:
              cpu: "2"
              ephemeral-storage: 30Gi
              memory: 2Gi
            requests:
              cpu: 1000m  # 调整为1核，与限制更匹配
              ephemeral-storage: 1Gi
              memory: 1Gi  # 调整为1GB，避免调度时节点资源不足
          # 优雅关闭配置：先停流量，再处理存量请求
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]  # 睡眠5秒，让K8s切走流量
      # 终止宽限期：给30秒处理存量请求
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: aly-registry
        - name: vpc-aly-registry
      restartPolicy: Always
