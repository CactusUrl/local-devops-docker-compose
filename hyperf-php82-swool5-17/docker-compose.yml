version: '3.7'
services:
  oms-hyperf:
#    image: "hyperf-php82-demo:latest"
    build:
      context: ./docker-file
      dockerfile: Dockerfile
    init: true
    dns:
      - 8.8.8.8  # 公共DNS服务器
    environment:
      APP_ENV: "${APP_ENV:-dev}"
    ports:
      - "80:${APP_PORT:-9501}"
      - 9502:9502
      - 9503:9503
    volumes:
      - "${OMS_PROJECT_PATH}:/webser/www/"
    container_name: "oms"
    networks:
      xzy_net_sail:
        ipv4_address: 172.169.0.21
    restart: "always"
    privileged: true
    deploy:
      replicas: 1
    entrypoint: ["sh", "-c", "php /webser/www/${PROJECT_NAME}/bin/hyperf.php start && sh /start.sh"]

networks:
  xzy_net_sail:
    driver: bridge
    ipam:
      config:
        - subnet: 172.169.0.0/24
          gateway: 172.169.0.1  # 显式指定网关
