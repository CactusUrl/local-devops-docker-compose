version: '3.7'
services:
  oms-hyperf:
    #    image: "registry.cn-hangzhou.aliyuncs.com/liwb/hyperf-demo:1.0"
    build:
      context: ./docker-file
      dockerfile: Dockerfile
    init: true
    environment:
      APP_ENV: "${APP_ENV:-dev}"
    ports:
      - "80:${APP_PORT:-9501}"
      - 9502:9502
      - 9503:9503
    volumes:
      - "${OMS_PROJECT_PATH}:/webser/www/"
      - "${LOG_DIR}:/webser/logs/"
    container_name: "oms"
    networks:
      xzy_net_sail:
        ipv4_address: 172.169.0.21
    dns:
      - 8.8.8.8  # 公共DNS服务器
    extra_hosts:
      - "xzy-hyperf-demo.local:172.169.0.21"
    restart: "always"
    privileged: true
    deploy:
      replicas: 1
    working_dir: "/webser/www/${PROJECT_NAME}"
#    entrypoint: sh -c "composer install && php ./bin/hyperf.php start" #首次项目初始化使用这个命令
    #    entrypoint: ["tail", "-f","/dev/null"]
    #    entrypoint: ["php", "./bin/hyperf.php", "start"] # compose install完vendor之后使用这个，不用浪费每次的compose install时间
    entrypoint: sh -c "mkdir -p /webser/logs/runtime && php ./bin/hyperf.php server:watch >> /webser/logs/runtime/watch.log 2>&1" # compose install完vendor之后使用这个，不用浪费每次的compose install时间,同时追加吸入日志采集

networks:
  xzy_net_sail:
    driver: bridge
    ipam:
      config:
        - subnet: 172.169.0.0/24
          gateway: 172.169.0.1  # 显式指定网关
