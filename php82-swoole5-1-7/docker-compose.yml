version: '3.7'
services:
  westmonth-wms:
    build:
      context: ./docker-file
      #dockerfile: Dockerfile
      dockerfile: Dockerfile-xdebug
    init: true
    dns:
      - 8.8.8.8  # 公共DNS服务器
    environment:
      APP_ENV: "${APP_ENV:-dev}"
    ports:
      - "80:${APP_PORT:-9601}"
      - 9501:9501
      - 9502:9502
      - 9503:9503
    volumes:
      - "${WMS_PROJECT_PATH}:/webser/www/"
      - '${WEB_NGINX_CONF_DIR}:/etc/nginx/conf.d'
    container_name: "wms"
    networks:
      xzy_net_sail:
        ipv4_address: 172.169.0.10
    restart: "always"
    privileged: true
    deploy:
      replicas: 1

networks:
  xzy_net_sail:
    driver: bridge
    ipam:
      config:
        - subnet: 172.169.0.0/24
          gateway: 172.169.0.1  # 显式指定网关
