[unix_http_server]
file=/run/supervisord.sock   ; (the path to the socket file)

[supervisord]
logfile=/webser/logs/supervisor/supervisord.log ; (main log file;default $CWD/supervisord.log)
logfile_maxbytes=50MB        ; (max main logfile bytes b4 rotation;default 50MB)
logfile_backups=10           ; (num of main logfile rotation backups;default 10)
loglevel=info                ; (log level;default info; others: debug,warn,trace)
pidfile=/run/supervisord.pid ; (supervisord pidfile;default supervisord.pid)
nodaemon=false               ; (start in foreground if true;default false)
minfds=1024                  ; (min. avail startup file descriptors;default 1024)
minprocs=200                 ; (min. avail process descriptors;default 200)
user=root                    ;

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock ; use a unix:// URL  for a unix socket

[program:nginx]
command=/usr/sbin/nginx -g "daemon off; error_log /dev/stderr info;"
autostart=true
autorestart=true
startsecs=5                     ; 启动后稳定 5 秒视为成功
startretries=3                  ; 最大重试次数
priority=15
user=root                   ; 以非 root 用户运行（避免权限问题）
stdout_events_enabled=true
stderr_events_enabled=true
stdout_logfile=/webser/logs/nginx/nginx.log  ; 日志输出路径
stdout_logfile_maxbytes=50MB
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=QUIT


[include]
files = /etc/supervisor.d/*.ini

