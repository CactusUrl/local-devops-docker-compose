services:
  mysql:
    image: 'mysql:8.0'
    container_name: mysql8
    ports:
      - '${DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${MYSQL_DB_DATABASE:-test}'
      MYSQL_USER: '${MYSQL_OPS_USERNAME}'
      MYSQL_PASSWORD: '${MYSQL_OPS_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
      TZ: Asia/Shanghai
    volumes:
      - '${DATA_PATH}/mysql:/var/lib/mysql'
      - './database/mysql/my-custom-sql-mode.cnf:/etc/mysql/conf.d/my-custom-sql-mode.cnf'
      - './database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
    networks:
      - middleware-db_middleware-sail
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${MYSQL_OPS_PASSWORD}"]
      retries: 3
      timeout: 5s
  redis:
    image: 'redis:alpine'
    container_name: redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - '${DATA_PATH}/redis:/data'
    environment:
      REDIS_PASSWORD: '${REDIS_PASSWORD}'
    command: redis-server --requirepass '${REDIS_PASSWORD}'
    networks:
      - middleware-db_middleware-sail
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      retries: 3
      timeout: 5s
  es:
    image: 'docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION:-9.5.5}'
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      node.name: gaia-es-01
      cluster.name: es-search-local
      discovery.type: single-node
      # Local development only; host access is restricted to loopback below.
      xpack.security.enabled: 'false'
      xpack.security.enrollment.enabled: 'false'
      node.store.allow_mmap: 'false'
      ES_JAVA_OPTS: '${ES_JAVA_OPTS:--Xms1g -Xmx1g}'
      TZ: Asia/Shanghai
    mem_limit: '${ES_MEMORY_LIMIT:-2g}'
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - '127.0.0.1:${ES_PORT:-9200}:9200'
    volumes:
      - '${DATA_PATH}/elasticsearch:/usr/share/elasticsearch/data'
    networks:
      - middleware-db_middleware-sail
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: '20m'
        max-file: '3'
  rabbit-mq:
    image: 'rabbitmq:3.13-management'
    container_name: "rabbit-3.13"
    volumes:
      - '${DATA_PATH}/rabbitmq/data:/data'
      - '${DATA_PATH}/rabbitmq/myplugins:/myplugins'
    ports:
      - '${RABBIT_MQ_CLIENT_PORT:-5672}:5672'
      - '${RABBIT_MQ_WEB_PORT:-15672}:15672'
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBIT_MQ_USER:-admin}"
      RABBITMQ_DEFAULT_PASS: "${RABBIT_MQ_PASSWORD:-rW9pJ8lN9gU3oH7nee}"
      RABBITMQ_DEFAULT_VHOST: /
    networks:
      - middleware-db_middleware-sail
  mongo-db:
    image: mongo:8.0
    container_name: mongodb
    command: [ "mongod", "--replSet", "rs0", "--keyFile", "/data/db/mongodb.key", "--bind_ip_all" ]
    restart: always
    ports:
      - "${MONGO_DB_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_DB_USER:-root}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_DB_PASSSWORD:-wera87914Ls}"
      TZ: Asia/Shanghai
    volumes:
      - '${DATA_PATH}/mongo-data:/data/db'
    networks:
      - middleware-db_middleware-sail
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "quit(db.hello().isWritablePrimary ? 0 : 1)", "-u", "${MONGO_DB_USER:-root}", "-p", "${MONGO_DB_PASSSWORD:-wera87914Ls}", "--authenticationDatabase", "admin" ]
      retries: 3
      timeout: 8s
  etcd:
    image: quay.io/coreos/etcd:v3.7.0
    container_name: etcd
    restart: always
    volumes:
      - etcd_data:/etcd-data
      - '${DATA_PATH}/etcd-data:/etcd-data'
    ports:
      - "2379:2379"
      - "2380:2380"
    command: >
      /usr/local/bin/etcd
      --name etcd-0
      --data-dir=/etcd-data
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://etcd:2379
      --listen-peer-urls http://0.0.0.0:2380
      --log-level info
      --logger zap
      --log-outputs stderr
    networks:
      - middleware-db_middleware-sail
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    restart: always
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-5432pgLEQ}"
      POSTGRES_DB: fastgpt
      TZ: Asia/Shanghai
    volumes:
      - '${DATA_PATH}/pgvector:/var/lib/postgresql/data'
    networks:
      - middleware-db_middleware-sail
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d fastgpt" ]
      interval: 10s
      timeout: 5s
      retries: 5
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-MinQW2718}"
    volumes:
      - '${DATA_PATH}/minio:/data'
    command: server /data --console-address ":9001"
    networks:
      - middleware-db_middleware-sail
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
  milvus:
    image: milvusdb/milvus:v3.0.3
    container_name: milvus
    command: [ "milvus", "run", "standalone" ]
    restart: always
    deploy:
      resources:
        limits:
          memory: "${MILVUS_MEMORY_LIMIT:-4g}"
        reservations:
          memory: "${MILVUS_MEMORY_RESERVATION:-2g}"
    security_opt:
      - seccomp:unconfined
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      TZ: Asia/Shanghai
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD:-MinQW2718}"
      MINIO_BUCKET_NAME: milvus-bucket
      MQ_TYPE: woodpecker
      LOG_LEVEL: "${MILVUS_LOG_LEVEL:-warn}"
      common.storage.useLoonFFI: "false"
      knowhere.enable: "true"
      dataCoord.targetVecIndexVersion: "10"
      dataCoord.targetScalarIndexVersion: "4"
      common.security.authorizationEnabled: "true"
      common.security.defaultRootPassword: "${MILVUS_ROOT_PASSWORD:-1027&!adminQtok}"
    volumes:
      - '${DATA_PATH}/milvus:/var/lib/milvus'
    depends_on:
      - etcd
      - minio
    networks:
      - middleware-db_middleware-sail
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9091/healthz" ]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
  # ===============================================================
  # Attu v3.0 ?? Milvus 可视化管理工具
  # 官方仓库: https://github.com/zilliztech/attu
  #
  # ?? v3 关键变更（与 v2 不兼容）：
  #   1. 环境变量由 MILVUS_URL 改为 MILVUS_ADDRESS
  #   2. 官方 tag 是 v3.0.0，不是 v3.0
  #   3. 仅支持 Milvus 2.6.0+ / 3.x 及 Zilliz Cloud（Milvus 2.5.x 及以下不支持）
  # ===============================================================
  attu:
    image: zilliz/attu:v3.0.0
    container_name: attu
    ports:
      - "3000:3000"
    environment:
      # 日志级别（Pino）：debug / info / warn / error
      - LOG_LEVEL=info
      # 审计日志保留天数；<=0 表示不自动清理
      - ATTU_AUDIT_RETENTION_DAYS=90
      # Milvus gRPC 请求超时（毫秒）
      - MILVUS_GRPC_TIMEOUT=15000
    volumes:
      # 持久化 SQLite（/data/attu.db）：保存连接、AI 会话、偏好设置。
      - '${DATA_PATH}/attu:/data'
    # ---------- 资源限制（按需调整或删除）----------
    mem_limit: 1g
    mem_reservation: 512m
    cpus: "1.0"
    restart: unless-stopped

networks:
  middleware-db_middleware-sail:
    driver: bridge
    name: middleware-db_middleware-sail
#    external: true
