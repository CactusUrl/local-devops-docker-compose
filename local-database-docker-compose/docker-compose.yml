services:
  mysql:
    image: 'mysql:8.0'
    container_name: mysql8
    ports:
      - '${DB_PORT:-3306}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: '${DB_ROOT_PASSWORD}'
      MYSQL_ROOT_HOST: '%'
      MYSQL_DATABASE: '${DB_DATABASE}'
      MYSQL_USER: '${DB_USERNAME}'
      MYSQL_PASSWORD: '${DB_PASSWORD}'
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
      TZ: Asia/Shanghai
    volumes:
      - '${DATA_PATH}/mysql:/var/lib/mysql'
      - './database/mysql/my-custom-sql-mode.cnf:/etc/mysql/conf.d/my-custom-sql-mode.cnf'
      - './database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
    networks:
      - middleware-db_middleware-sail
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASSWORD}"]
      retries: 3
      timeout: 5s
  redis:
    image: 'redis:alpine'
    container_name: redis
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - '${DATA_PATH}/redis:/data'
    environment:
      REDIS_PASSWORD: '${REDIS_PASSWORD}'
    command: redis-server --requirepass '${REDIS_PASSWORD}'
    networks:
      - middleware-db_middleware-sail
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      retries: 3
      timeout: 5s
  rabbit-mq:
    image: 'rabbitmq:3.13-management'
    container_name: "rabbit-3.13"
    volumes:
      - '${DATA_PATH}/rabbitmq/data:/data'
      - '${DATA_PATH}/rabbitmq/myplugins:/myplugins'
    ports:
      - '${RABBIT_MQ_CLIENT_PORT:-5672}:5672'
      - '${RABBIT_MQ_WEB_PORT:-15672}:15672'
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBIT_MQ_USER:-admin}"
      RABBITMQ_DEFAULT_PASS: "${RABBIT_MQ_PASSWORD:-rW9pJ8lN9gU3oH7nee}"
      RABBITMQ_DEFAULT_VHOST: /
    networks:
      - middleware-db_middleware-sail
  mongo-db:
    image: mongo:8.0
    container_name: mongodb
    restart: always
    ports:
      - "${MONGO_DB_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_DB_USER:-root}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_DB_PASSSWORD:-wera87914Ls}"
      TZ: Asia/Shanghai
    volumes:
      - '${DATA_PATH}/mongo-data:/data/db'
    networks:
      - middleware-db_middleware-sail
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')", "-u", "${MONGO_DB_USER:-root}", "-p", "${MONGO_DB_PASSSWORD:-wera87914Ls}", "--authenticationDatabase", "admin" ]
      retries: 3
      timeout: 8s
  etcd:
    image: quay.io/coreos/etcd:v3.7.0
    container_name: etcd
    restart: always
    volumes:
      - etcd_data:/etcd-data
      - '${DATA_PATH}/etcd-data:/etcd-data'
    ports:
      - "2379:2379"
      - "2380:2380"
    command: >
      /usr/local/bin/etcd
      --name etcd-0
      --data-dir=/etcd-data
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://etcd:2379
      --listen-peer-urls http://0.0.0.0:2380
      --log-level info
      --logger zap
      --log-outputs stderr
    networks:
      - middleware-db_middleware-sail


networks:
  middleware-db_middleware-sail:
    driver: bridge
    name: middleware-db_middleware-sail
#    external: true
